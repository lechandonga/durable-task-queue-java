server.port=8080
server.shutdown=graceful

# ===== 本地持久化任务队列配置 =====
# 本地持久化目录（JSON Lines 文件，无需任何外部中间件）
task-queue.storage-dir=${TASK_QUEUE_STORAGE_DIR:data/task-queue}
# 活动任务（PENDING/RUNNING，含等待重试）容量上限
task-queue.capacity=${TASK_QUEUE_CAPACITY:1000}
# 最大尝试次数（含首次执行），可重试失败达到本次数后进入死信
task-queue.max-attempts=${TASK_QUEUE_MAX_ATTEMPTS:5}
# 首次重试退避；之后按 backoff-multiplier 指数递增，封顶 max-backoff
task-queue.backoff=${TASK_QUEUE_BACKOFF:10s}
task-queue.backoff-multiplier=${TASK_QUEUE_BACKOFF_MULTIPLIER:2.0}
task-queue.max-backoff=${TASK_QUEUE_MAX_BACKOFF:30m}
# 并发消费者数量
task-queue.concurrency=${TASK_QUEUE_CONCURRENCY:2}
# 租约时长：执行期间自动续约，超时失联的任务会被重新投递
task-queue.lease-ttl=${TASK_QUEUE_LEASE_TTL:5m}
# 空闲轮询间隔
task-queue.poll-interval=${TASK_QUEUE_POLL_INTERVAL:200ms}

# 停机时等待在途任务完成的宽限期（Spring 容器关闭）
spring.lifecycle.timeout-per-shutdown-phase=35s
