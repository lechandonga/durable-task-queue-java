server.port=0

# ===== 本地持久化任务队列配置（taskqueue.* 均有默认值，可按需覆盖）=====
# 本地持久化目录，只落在本机文件系统，不依赖任何外部中间件
taskqueue.data-dir=./data/task-queue
# 活跃（未终结）任务容量上限；超限拒绝原因 QUEUE_FULL
taskqueue.capacity=1000
# 最大尝试次数（含首次）；可重试失败达到此次数后进入死信
taskqueue.max-attempts=5
# 指数退避：第 n 次重试延迟 = base-backoff * multiplier^(n-1) * (1 ± jitter)
taskqueue.base-backoff=2s
taskqueue.backoff-multiplier=2.0
taskqueue.backoff-jitter=0.2
# 单次执行租约时长；消费者自动续租，过期未续租可被回收重领
taskqueue.lease-duration=30s
# 并发消费者数量
taskqueue.concurrency=2
# 优雅停机最长等待
taskqueue.shutdown-timeout=20s
# journal 文件超过该大小触发压缩；-1 关闭压缩
taskqueue.compact-threshold-bytes=1048576
